.slide .compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
.compare-col{border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.compare-col.is-muted{border-style:dashed}
.compare-col.is-accent{background:var(--soft);border-color:transparent}
.compare-label{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.compare-col.is-accent .compare-label{color:var(--accent)}
.compare-col ul{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.compare-col li{font-size:clamp(15px,1.35vw,19px);line-height:1.5;display:grid;grid-template-columns:16px 1fr;gap:10px;color:var(--muted)}
.compare-col.is-accent li{color:var(--ink)}
.compare-col li:before{content:"•";color:var(--accent);font-weight:800}
.slide .loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:30px}
.loop-step{position:relative;border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--white)}
.loop-step:not(:nth-last-child(2)):after{content:"→";position:absolute;right:-11px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:800;background:var(--paper);padding:0 2px;z-index:1}
.loop-step h2{font-size:clamp(15px,1.25vw,18px);line-height:1.3;margin:0 0 8px;letter-spacing:-.3px}
.loop-step p{font-size:clamp(13px,1.1vw,15px);line-height:1.5;color:var(--muted)}
.loop-return{grid-column:1/-1;text-align:center;color:var(--accent);font-weight:800;font-size:17px;line-height:1}
.slide .bars{margin-top:30px;display:grid;gap:17px}
.bar-row{display:grid;gap:7px}
.bar-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.bar-label{font-size:clamp(15px,1.3vw,18px);line-height:1.35}
.bar-value{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(16px,1.4vw,20px);color:var(--accent);white-space:nowrap}
.bar-track{height:13px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:999px;min-width:6px}
